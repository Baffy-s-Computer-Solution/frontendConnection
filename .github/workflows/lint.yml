name: Lint Code

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            mapfile -d '' changed_files < <(
              git diff --diff-filter=ACMRT --name-only -z "$BASE_SHA" "$HEAD_SHA" -- \
                '*.js' '*.jsx' '*.ts' '*.tsx'
            )
          else
            mapfile -d '' changed_files < <(
              git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx'
            )
          fi

          files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ] && [[ "$file" != *.config.js ]]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint "${files[@]}" --format json --output-file eslint-report.json \
              --cache --cache-location node_modules/.cache/eslint/
          else
            rm -f eslint-report.json
            echo "No changed JavaScript or TypeScript files need ESLint validation."
          fi

      - name: Annotate ESLint results
        uses: ataylorme/eslint-annotate-action@v2
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          report-json: eslint-report.json
        if: ${{ always() && hashFiles('eslint-report.json') != '' }}

  prettier:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            mapfile -d '' changed_files < <(
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- \
                '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.html' '*.css' '*.scss'
            )
          else
            mapfile -d '' changed_files < <(
              git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.html' '*.css' '*.scss'
            )
          fi

          files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --check "${files[@]}"
          else
            echo "No changed files need Prettier validation."
          fi

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Stylelint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            mapfile -d '' changed_files < <(
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- '*.css' '*.scss' '*.sass'
            )
          else
            mapfile -d '' changed_files < <(
              git ls-files -z -- '*.css' '*.scss' '*.sass'
            )
          fi

          files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -gt 0 ]; then
            npx stylelint "${files[@]}"
          else
            echo "No changed stylesheets need Stylelint validation."
          fi

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            commits="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"
            if [ -z "$commits" ]; then
              echo "No new commits need Commitlint validation."
              exit 0
            fi

            while IFS= read -r commit; do
              git show -s --format=%B "$commit" | npx commitlint --verbose
            done <<< "$commits"
          else
            git show -s --format=%B "$HEAD_SHA" | npx commitlint --verbose
          fi

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip SonarQube when credentials are not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' || env.SONAR_PROJECT_KEY == '' }}
        run: echo "::notice::SonarQube scan skipped; configure SONAR_TOKEN, SONAR_HOST_URL, and SONAR_PROJECT_KEY to enable it."

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: .
          args: -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
