name: Continuous Integration

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  NODE_VERSION: 18.x

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            mapfile -d '' changed_files < <(
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- \
                '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.html' '*.css' '*.scss'
            )
          else
            mapfile -d '' changed_files < <(
              git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.md' '*.html' '*.css' '*.scss'
            )
          fi

          files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ] && [[ "$file" != *.config.js ]]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --check "${files[@]}"
          else
            echo "No changed files need Prettier validation."
          fi

      - name: Lint code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$HEAD_SHA^" 2>/dev/null || true)"
          fi

          if [ -n "$BASE_SHA" ]; then
            mapfile -d '' changed_files < <(
              git diff --diff-filter=ACMRT --name-only -z "$BASE_SHA" "$HEAD_SHA" -- \
                '*.js' '*.jsx' '*.ts' '*.tsx'
            )
          else
            mapfile -d '' changed_files < <(
              git ls-files -z -- '*.js' '*.jsx' '*.ts' '*.tsx'
            )
          fi

          files=()
          for file in "${changed_files[@]}"; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -gt 0 ]; then
            npx eslint "${files[@]}" --cache --cache-location node_modules/.cache/eslint/
          else
            echo "No changed JavaScript or TypeScript files need ESLint validation."
          fi

      - name: Type check
        run: |
          npm run type-check

      - name: Run tests
        run: |
          npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env

      - name: Build application
        run: |
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-dist
          path: dist
          retention-days: 7

  cache-dependencies:
    name: Cache Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node modules
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies (if cache miss)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --legacy-peer-deps
